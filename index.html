<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortune cookie paper tool</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" aria-label="Editor controls">
        <input id="image-input" class="file-input" type="file" accept="image/*" />
        <button type="button" class="nav-command" data-action="load-image">Load image</button>

        <details class="menu-panel primary-panel">
          <summary>Back</summary>
          <div class="menu-content">
            <div class="swatch-grid" data-back-options></div>
          </div>
        </details>

        <button type="button" class="nav-command" data-action="reset">Reset</button>
        <button type="button" class="nav-command" data-action="undo">Undo</button>
        <button type="button" class="nav-command" data-action="export">Export</button>

        <span class="toolbar-spacer"></span>

        <details class="menu-panel secondary-panel">
          <summary>Frame</summary>
          <div class="menu-content compact-content">
            <div class="button-grid" data-frame-options></div>
          </div>
        </details>

        <details class="menu-panel secondary-panel">
          <summary>Paper size</summary>
          <div class="menu-content">
            <div class="segmented" data-paper-mode-options></div>
            <div class="number-row">
              <label>
                w
                <input id="paper-width" type="number" min="80" />
              </label>
              <label>
                h
                <input id="paper-height" type="number" min="80" />
              </label>
            </div>
          </div>
        </details>

        <details class="menu-panel secondary-panel">
          <summary>Background</summary>
          <div class="menu-content">
            <div class="swatch-grid" data-background-options></div>
          </div>
        </details>

        <details class="menu-panel secondary-panel">
          <summary>Color</summary>
          <div class="menu-content">
            <div class="swatch-grid" data-front-options></div>
          </div>
        </details>

        <details class="menu-panel secondary-panel">
          <summary>Folds</summary>
          <div class="menu-content compact-content">
            <div class="corner-grid" data-fold-options></div>
          </div>
        </details>

        <details class="menu-panel secondary-panel text-menu">
          <summary>Text</summary>
          <div class="menu-content">
            <textarea id="text-input" spellcheck="false"></textarea>
          </div>
        </details>

        <details class="menu-panel secondary-panel">
          <summary>Rotate</summary>
          <div class="menu-content">
            <label class="slider-label">
              <span data-rotation-label>0°</span>
              <input id="rotate-input" type="range" min="-45" max="45" />
            </label>
          </div>
        </details>

      </header>

      <section class="canvas-stage" aria-label="Composition preview">
        <canvas id="preview-canvas"></canvas>
      </section>

      <footer class="statusbar">
        <span>© Fortune Paper Tool™ 2026 v0.1</span>
        <span data-fold-count>0 folds</span>
        <span>PNG export ready</span>
      </footer>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
