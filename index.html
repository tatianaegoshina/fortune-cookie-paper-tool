<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortune cookie paper tool</title>
    <link rel="stylesheet" href="./src/styles.css?v=20260530-ui-4" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" aria-label="Editor controls">
        <input id="image-input" class="file-input" type="file" accept="image/*" />
        <div class="menu-group">
          <details class="menu-panel">
            <summary>Frame</summary>
            <div class="menu-content compact-content">
              <div class="button-grid" data-frame-options></div>
            </div>
          </details>

          <details class="menu-panel">
            <summary>Paper size</summary>
            <div class="menu-content">
              <div class="segmented" data-paper-mode-options></div>
              <div class="number-row" data-paper-custom-fields>
                <label>
                  W
                  <input id="paper-width" type="number" min="80" />
                </label>
                <label>
                  H
                  <input id="paper-height" type="number" min="80" />
                </label>
              </div>
            </div>
          </details>

          <details class="menu-panel">
            <summary>Rotate</summary>
            <div class="menu-content compact-content">
              <div class="number-row">
                <label>
                  Angle
                  <input id="paper-rotation" type="number" />
                </label>
              </div>
            </div>
          </details>

          <details class="menu-panel">
            <summary>Color</summary>
            <div class="menu-content">
              <button type="button" class="select-button" data-action="load-image">Image</button>
              <div class="swatch-grid" data-front-options></div>
            </div>
          </details>

          <details class="menu-panel">
            <summary>Folds</summary>
            <div class="menu-content compact-content">
              <div class="swatch-grid" data-back-options></div>
            </div>
          </details>

          <details class="menu-panel">
            <summary>Background</summary>
            <div class="menu-content">
              <button type="button" class="select-button" data-action="load-background-image">Image</button>
              <div class="swatch-grid" data-background-options></div>
            </div>
          </details>

          <details class="menu-panel">
            <summary>Text</summary>
            <div class="menu-content compact-content">
              <div class="number-row">
                <label>
                  Size
                  <input id="text-size" type="number" min="1" />
                </label>
              </div>
            </div>
          </details>
        </div>

        <div class="menu-group action-group">
          <button type="button" class="nav-command" data-action="undo">Undo</button>
          <button type="button" class="nav-command" data-action="reset">Reset</button>
          <button type="button" class="nav-command" data-action="export">Export</button>
        </div>
      </header>

      <section class="canvas-stage" aria-label="Composition preview">
        <canvas id="preview-canvas"></canvas>
        <div class="fold-handle-layer" aria-hidden="true"></div>
        <textarea id="text-input" class="canvas-text-editor" spellcheck="false" aria-label="Paper text"></textarea>
      </section>

    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
