<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortune cookie paper tool</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="tool-panel" aria-label="Editor controls">
        <div class="brand-row">
          <div>
            <p class="eyebrow">Fortune cookie</p>
            <h1>Paper tool</h1>
          </div>
          <button type="button" class="icon-button" data-action="reset" aria-label="Reset">↺</button>
        </div>

        <div class="control-group">
          <span class="control-label">frame</span>
          <div class="button-grid" data-frame-options></div>
        </div>

        <div class="control-group">
          <span class="control-label">paper size</span>
          <div class="segmented" data-paper-mode-options></div>
          <div class="number-row">
            <label>
              w
              <input id="paper-width" type="number" min="80" />
            </label>
            <label>
              h
              <input id="paper-height" type="number" min="80" />
            </label>
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">background</span>
          <div class="swatch-grid" data-background-options></div>
        </div>

        <div class="control-group">
          <span class="control-label">color</span>
          <div class="swatch-grid" data-front-options></div>
        </div>

        <div class="control-group">
          <span class="control-label">back color</span>
          <div class="swatch-grid" data-back-options></div>
        </div>

        <div class="control-group">
          <span class="control-label">folds</span>
          <div class="corner-grid" data-fold-options></div>
        </div>

        <div class="control-group">
          <span class="control-label">image</span>
          <input id="image-input" class="file-input" type="file" accept="image/*" />
          <button type="button" class="wide-button" data-action="load-image">load image</button>
          <button type="button" class="text-button" data-action="remove-image" hidden>remove image</button>
        </div>

        <div class="control-group">
          <label class="control-label" for="text-input">text</label>
          <textarea id="text-input" spellcheck="false"></textarea>
          <label class="slider-label">
            <span data-text-size-label>text size</span>
            <input id="text-size" type="range" min="24" max="260" />
          </label>
        </div>

        <div class="control-group">
          <label class="control-label" for="rotate-input">rotate</label>
          <label class="slider-label">
            <span data-rotation-label>0°</span>
            <input id="rotate-input" type="range" min="-45" max="45" />
          </label>
        </div>

        <div class="actions">
          <button type="button" class="secondary-button" data-action="reset">reset</button>
          <button type="button" class="primary-button" data-action="export">export</button>
        </div>
      </section>

      <section class="canvas-stage" aria-label="Composition preview">
        <canvas id="preview-canvas"></canvas>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
